{% extends 'base.html' %}
{% load static %}

{% block title %}Offline - Marina Management{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-5">
                <i class="bi bi-wifi-off text-muted mb-4" style="font-size: 5rem;"></i>
                <h1 class="fw-bold mb-3">You are offline</h1>
                <p class="text-muted mb-4">
                    It seems you have lost your internet connection. <br>
                    Please check your connection and try again.
                </p>
                <button onclick="window.location.reload()" class="btn btn-primary btn-lg rounded-pill px-5">
                    <i class="bi bi-arrow-clockwise me-2"></i> Retry
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
