{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Yearly Planning - Marina Samos{% endblock %}

{% block extra_head %}
<link href="{% static 'vendor/visjs/vis-timeline-graph2d.min.css' %}" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="{% static 'vendor/flag-icons/css/flag-icons.min.css' %}"/>
<style>
    body {
        overflow: hidden;
    }
    main.container-fluid {
        padding-bottom: 0 !important;
    }
    #visualization {
        border: 1px solid #ddd;
        border-radius: 8px;
        background: white;
    }
    .vis-item {
        font-size: 12px;
        border-radius: 4px;
        box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        height: 30px !important;
    }
    .vis-item .vis-item-content { 
        padding: 0 6px !important; 
        height: 100% !important;
        line-height: 30px !important;
        display: block !important;
    }
    .vis-panel.vis-left { background-color: #f8f9fa; border-right: 1px solid #ddd; width: 120px !important; }
    .vis-label { border-bottom: 1px solid #eee !important; font-size: 12px; cursor: pointer; }
    .vis-label .vis-inner { padding: 4px 8px !important; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vis-label.vis-nested .vis-inner { padding-left: 8px !important; background-color: white !important; }
    .vis-group-level-unknown-but-gte1 { border: 1px solid #ddd !important; background-color: #f5f5f5 !important; }
    
    /* Fixed size Bootstrap-style arrows */
    .vis-label.vis-nesting-group:before {
        font-family: 'bootstrap-icons' !important;
        content: "\F285" !important; /* chevron-right */
        display: inline-block;
        transition: transform 0.2s;
        width: 20px;
        text-align: center;
        font-size: 14px;
    }
    .vis-label.vis-nesting-group.expanded:before {
        transform: rotate(90deg);
        content: "\F285" !important;
    }
    
    .planning-header { background: white; border-bottom: 2px solid #eee; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-calendar-range text-primary me-2"></i>{% trans "Yearly Planning Matrix" %}</h5>
    <div class="d-flex gap-2">
        <div class="input-group input-group-sm" style="width: 250px;">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchBoat" class="form-control border-start-0" placeholder="{% trans 'Search boat or owner...' %}" oninput="filterByBoat()">
        </div>
        <select id="year-selector" class="form-select form-select-sm" style="width: 100px;" onchange="loadData()">
            <option value="2026" selected>2026</option>
            <option value="2027">2027</option>
        </select>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-warning" onclick="createWorkOrder()"><i class="bi bi-tools me-1"></i>{% trans "New Work Order" %}</button>
            <button class="btn btn-outline-secondary" onclick="handleZoomIn()"><i class="bi bi-zoom-in"></i></button>
            <button class="btn btn-outline-secondary" onclick="handleZoomOut()"><i class="bi bi-zoom-out"></i></button>
            <button class="btn btn-outline-primary" onclick="loadData()"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
    </div>
</div>

<style>
    .bg-warning-soft { background-color: #fff3cd !important; border-top: 2px solid #ffecb5 !important; border-bottom: 2px solid #ffecb5 !important; }
</style>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div id="visualization" style="height: calc(100vh - 195px);"></div>
    </div>
</div>

<!-- Modal for info -->
<div id="modals-here" class="modal modal-blur fade" style="display: none" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'vendor/visjs/vis-timeline-graph2d.min.js' %}"></script>
<script>
    let timeline;
    let items = new vis.DataSet();
    let groups = new vis.DataSet();
    let allGroups = [];
    let allItems = [];

    function getEmojiFlag(countryCode) {
        if (!countryCode || countryCode === 'xx' || countryCode === '-') return '🏳️';
        const codePoints = countryCode
            .toUpperCase()
            .split('')
            .map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }

    function initTimeline() {
        const container = document.getElementById('visualization');
        const year = document.getElementById('year-selector').value;
        
        const fortyFiveDays = 1000 * 60 * 60 * 24 * 45;
        const options = {
            stack: true,
            groupOrder: 'order',
            horizontalScroll: true,
            verticalScroll: true,
            maxHeight: 'calc(100vh - 195px)',
            zoomKey: 'ctrlKey',
            orientation: 'top',
            start: new Date(),
            end: new Date(new Date().getTime() + fortyFiveDays),
            zoomMin: 1000 * 60 * 60 * 24 * 7, // 7 days
            zoomMax: 1000 * 60 * 60 * 24 * 365 * 2, // 2 years
            xss: { disabled: true },
            editable: false,
            margin: { item: 4, axis: 5 },
            template: function(item) {
                if (!item) return '';
                const popoverContent = `
                    <div class="p-1 text-dark" style="min-width: 200px;">
                        <img src="${item.boat_image}" class="img-fluid rounded mb-2" style="max-height: 120px; width: 100%; object-fit: cover;">
                        <div class="mb-1 d-flex align-items-center">
                            <span class="fi fi-${item.flag} fis me-2"></span>
                            <span class="fw-bold">${item.owner}</span>
                        </div>
                        <div class="small text-muted">
                            <i class="bi bi-ship"></i> ${item.boat_type}<br>
                            <i class="bi bi-calendar-check"></i> In: ${item.arrival}<br>
                            <i class="bi bi-calendar-x"></i> Out: ${item.departure}<br>
                            <hr class="my-1">
                            <i class="bi bi-telephone"></i> ${item.phone}<br>
                            <i class="bi bi-gear"></i> ${item.engine}<br>
                            <i class="bi bi-arrows-fullscreen"></i> ${item.specs} (${item.draft}m)<br>
                            <i class="bi bi-fuel-pump"></i> ${item.diesel}L | <i class="bi bi-droplet"></i> ${item.water}L<br>
                            <i class="bi bi-translate"></i> ${item.language} | <i class="bi bi-calendar3"></i> ${item.year}<br>
                            <i class="bi bi-hash"></i> Ref: ${item.ref}
                            ${item.notes ? `<div class="mt-2 p-1 bg-light border-start border-3 border-warning small">Note: ${item.notes}</div>` : ''}
                        </div>
                    </div>
                `.replace(/"/g, '&quot;').replace(/\s+/g, ' ');

                return `
                    <div style="height: 30px; line-height: 30px; display: block; overflow: hidden;">
                        <span data-bs-toggle="popover" 
                              data-bs-trigger="hover focus"
                              data-bs-placement="bottom"
                              data-bs-html="true" 
                              data-bs-container="body"
                              data-bs-title="<strong>${item.content}</strong>" 
                              data-bs-content="${popoverContent}"
                              style="cursor: help;">
                            <span class="text-primary me-1" style="font-weight: bold; vertical-align: middle;">ⓘ</span>
                            <span class="fi fi-${item.flag} fis me-1" style="display: inline-block; vertical-align: middle; line-height: normal; border-radius: 2px;"></span>
                            <span style="display: inline-block; vertical-align: middle; line-height: normal;">${item.content}</span>
                        </span>
                    </div>
                `;
            }
        };

        timeline = new vis.Timeline(container, items, groups, options);

        // Edit booking or service on click
        timeline.on('click', function (properties) {
            if (properties.item) {
                const item = items.get(properties.item);
                if (item.category === 'service') {
                    editWorkOrder(item.order_id);
                } else {
                    editBooking(properties.item);
                }
            }
        });

        // Create booking on double-click empty space
        timeline.on('doubleClick', function (properties) {
            if (!properties.item && properties.group) {
                if (properties.group === 'group_services') {
                    createWorkOrder();
                } else if (!String(properties.group).startsWith('block_')) {
                    // Determine the start and end dates based on click position
                    const startDate = new Date(properties.time);
                    // Assume a default duration of 7 days
                    const endDate = new Date(startDate.getTime() + 7 * 24 * 60 * 60 * 1000);
                    
                    const startStr = startDate.toISOString().split('T')[0];
                    const endStr = endDate.toISOString().split('T')[0];
                    const berthId = properties.group;
                    
                    createBooking(berthId, startStr, endStr);
                }
            }
        });
        
        // Listen for data changes from modals
        document.body.addEventListener('planningDataChanged', () => {
            loadData();
            // Close modal if open
            const modalEl = document.getElementById('modals-here');
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
        });
    }

    function createWorkOrder(boatId) {
        let url = `{% url 'work_order_create' %}`;
        if (boatId) url += `?boat_id=${boatId}`;
        
        const modalEl = document.getElementById('modals-here');
        modalEl.addEventListener('htmx:afterSwap', function handler() {
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
            modalEl.removeEventListener('htmx:afterSwap', handler);
        });
        htmx.ajax('GET', url, {target: '#modals-here .modal-content', swap: 'innerHTML'});
    }

    function editWorkOrder(orderId) {
        if (!orderId) return;
        const url = `/service/edit/${orderId}/`;
        const modalEl = document.getElementById('modals-here');
        modalEl.addEventListener('htmx:afterSwap', function handler() {
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
            modalEl.removeEventListener('htmx:afterSwap', handler);
        });
        htmx.ajax('GET', url, {target: '#modals-here .modal-content', swap: 'innerHTML'});
    }

    function createBooking(berthId, startStr, endStr) {
        if (!berthId) return;
        let url = `/booking/create/?resource=${berthId}`;
        if (startStr) url += `&start=${startStr}`;
        if (endStr) url += `&end=${endStr}`;
        
        const modalEl = document.getElementById('modals-here');
        modalEl.addEventListener('htmx:afterSwap', function handler() {
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
            modalEl.removeEventListener('htmx:afterSwap', handler);
        });
        htmx.ajax('GET', url, {target: '#modals-here .modal-content', swap: 'innerHTML'});
    }

    function editBooking(bookingId) {
        if (!bookingId) return;
        const url = `/booking/edit/${bookingId}/`;
        const modalEl = document.getElementById('modals-here');
        modalEl.addEventListener('htmx:afterSwap', function handler() {
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
            modalEl.removeEventListener('htmx:afterSwap', handler);
        });
        htmx.ajax('GET', url, {target: '#modals-here .modal-content', swap: 'innerHTML'});
    }

    function loadData() {
        const year = document.getElementById('year-selector').value;
        fetch(`/api/planning-data/?year=${year}`)
            .then(res => res.json())
            .then(data => {
                allGroups = data.groups;
                allItems = data.items;
                
                groups.clear();
                groups.add(data.groups.map(g => {
                    const isBlock = String(g.id).startsWith('block_');
                    const color = g.color || g.block_color || '#aaa';
                    
                    if (isBlock) {
                        const icon = g.block_type === 'SERVICE' ? 'bi-tools' : 'bi-water';
                        return {
                            ...g,
                            content: `<i class="bi ${icon} me-2"></i><strong>${g.content}</strong>`
                        };
                    } else {
                        return {
                            ...g,
                            content: `<span style="border-left: 3px solid ${color}; padding-left: 8px;">${g.content}</span>`
                        };
                    }
                }));
                
                items.clear();
                items.add(data.items);
            })
            .catch(err => console.error("Error loading planning data:", err));
    }

    // Global Event Delegation for Popovers
    document.body.addEventListener('mouseover', function (e) {
        const target = e.target.closest('[data-bs-toggle="popover"]');
        if (target && !target.hasAttribute('data-popover-initialized')) {
            new bootstrap.Popover(target, { container: 'body' }).show();
            target.setAttribute('data-popover-initialized', 'true');
        }
    });

    function filterByBoat() {
        const search = document.getElementById('searchBoat').value.toLowerCase();
        if (!search) {
            groups.clear();
            groups.add(allGroups);
            return;
        }
        
        // 1. Find matching group IDs based on boat or owner name
        const matchingGroupIds = allItems
            .filter(item => 
                item.content.toLowerCase().includes(search) || 
                (item.owner && item.owner.toLowerCase().includes(search))
            )
            .map(item => String(item.group));
            
        const uniqueMatchingGroupIds = [...new Set(matchingGroupIds)];
        
        const filtered = allGroups.filter(g => {
            // Match berth
            if (uniqueMatchingGroupIds.includes(String(g.id))) return true;
            
            // Match block that has matching berths
            if (g.nestedGroups) {
                return g.nestedGroups.some(childId => uniqueMatchingGroupIds.includes(String(childId)));
            }
            return false;
        });
        
        groups.clear();
        groups.add(filtered);
    }

    function moveWindow(percentage) {
        if (!timeline) return;
        const range = timeline.getWindow();
        const interval = range.end - range.start;
        timeline.setWindow({
            start: range.start.valueOf() - interval * percentage,
            end:   range.end.valueOf()   - interval * percentage
        });
    }

    function handleZoomIn() {
        if (timeline) timeline.zoomIn(0.5);
    }
    
    function handleZoomOut() {
        if (timeline) timeline.zoomOut(0.5);
    }

    document.addEventListener('DOMContentLoaded', () => {
        initTimeline();
        loadData();

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                moveWindow(0.1); // Move 10% back
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                moveWindow(-0.1); // Move 10% forward
                e.preventDefault();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                const centerPanel = document.querySelector('#visualization .vis-panel.vis-center');
                const leftPanel = document.querySelector('#visualization .vis-panel.vis-left');
                if (centerPanel || leftPanel) {
                    const scrollAmount = e.key === 'ArrowUp' ? -40 : 40;
                    if (centerPanel) centerPanel.scrollTop += scrollAmount;
                    if (leftPanel) leftPanel.scrollTop += scrollAmount;
                    e.preventDefault();
                }
            }
        });
    });
</script>
{% endblock %}
