{% extends "base.html" %}

{% block title %}Planning Grid - Marina Samos{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0">Yearly Planning Grid</h5>
        <div class="d-flex gap-2">
            <select id="year-selector" class="form-select form-select-sm" style="width: 120px;" onchange="loadData()">
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
            </select>
            <input type="text" id="filter-text-box" class="form-control form-control-sm" placeholder="Search..." oninput="onFilterTextBoxChanged()">
            <button class="btn btn-sm btn-outline-primary" onclick="onBtnExport()">Export CSV</button>
        </div>
    </div>
    <div class="card-body p-0">
        <div id="planningGrid" class="ag-theme-alpine w-100" style="height: 700px;"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const columnDefs = [
        { field: "block", rowGroup: true, hide: true, cellRenderer: function(params) {
            return `<span style="border-left: 10px solid ${params.data.block_color}; padding-left: 5px;">${params.value}</span>`;
        }},
        { field: "berth", rowGroup: true, hide: true, headerName: "Berth #" },
        { field: "date", headerName: "Date", sortable: true, filter: 'agDateColumnFilter', sort: 'asc' },
        { field: "boat_name", headerName: "Boat Name", flex: 1 },
        { field: "flag", headerName: "Flag", width: 80 },
        { field: "status", headerName: "Status", cellRenderer: function(params) {
            let color = 'secondary';
            if (params.value === 'Occupied') color = 'danger';
            if (params.value === 'At Sea') color = 'info';
            if (params.value === 'Vacant') color = 'success';
            return `<span class="badge bg-${color}">${params.value}</span>`;
        }},
        { field: "arrival", headerName: "Arrival" },
        { field: "departure", headerName: "Departure" },
        { field: "days", headerName: "Days", width: 80 }
    ];

    const gridOptions = {
        columnDefs: columnDefs,
        defaultColDef: {
            resizable: true,
            sortable: true,
            filter: true,
            floatingFilter: true,
        },
        autoGroupColumnDef: {
            headerName: 'Block / Berth',
            minWidth: 250,
            cellRendererParams: {
                suppressCount: false,
            }
        },
        rowData: [],
        groupDefaultExpanded: 1, // Expand blocks by default
        animateRows: true,
        pagination: true,
        paginationPageSize: 100,
    };

    let gridApi;

    function loadData() {
        const year = document.getElementById('year-selector').value;
        if (gridApi) gridApi.showLoadingOverlay();
        fetch(`/api/planning-data/?year=${year}`)
            .then(response => response.json())
            .then(data => {
                gridApi.setGridOption('rowData', data);
            });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const gridDiv = document.querySelector('#planningGrid');
        gridApi = agGrid.createGrid(gridDiv, gridOptions);
        loadData();
    });

    function onFilterTextBoxChanged() {
        gridApi.setGridOption(
            'quickFilterText',
            document.getElementById('filter-text-box').value
        );
    }

    function onBtnExport() {
        gridApi.exportDataAsCsv();
    }
</script>
{% endblock %}
