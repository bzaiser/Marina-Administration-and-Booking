{% extends "base.html" %}
{% load static %}

{% block title %}Customer Management - Marina Samos{% endblock %}

{% block content %}
<div class="row g-0 h-100">
    <div class="col flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <!-- Header -->
        <div class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
            <div class="d-flex align-items-center">
                <div class="bg-primary-subtle text-primary p-2 rounded-3 me-3">
                    <i class="bi bi-people-fill fs-4"></i>
                </div>
                <div>
                    <h5 class="mb-0 fw-bold">Customer Management</h5>
                    <p class="text-muted small mb-0">Manage boat owners and their fleet</p>
                </div>
            </div>
            <div class="d-flex gap-2">
                <div class="input-group input-group-sm" style="width: 250px;">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" id="gridSearch" class="form-control border-start-0 ps-0" placeholder="Quick search..." oninput="onFilterTextBoxChanged()">
                </div>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()" title="Reset Filters">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
                <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="createCustomer()">
                    <i class="bi bi-person-plus-fill me-1"></i>New Customer
                </button>
            </div>
        </div>

        <!-- Grid Container -->
        <div class="flex-grow-1 position-relative bg-light">
            <div id="customerGrid" class="ag-theme-alpine w-100 h-100"></div>
        </div>
    </div>

    <!-- Boat Detail Panel (Sliding from right) -->
    <div id="boatDetailPanel" class="border-start bg-white shadow-lg d-none flex-column" style="width: 350px; z-index: 1050;">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light">
            <h6 class="mb-0 fw-bold text-primary"><i class="bi bi-ship-wheel me-2"></i>Boat Details</h6>
            <button class="btn-close" onclick="hideBoatDetails()"></button>
        </div>
        <div class="p-0 overflow-auto flex-grow-1" id="boatDetailContent">
            <!-- Dynamic Content -->
        </div>
        <div class="p-3 border-top bg-light">
            <button class="btn btn-primary w-100" id="editBoatBtn">
                <i class="bi bi-pencil-square me-2"></i>Edit Boat Data
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- AG Grid JS (v33+ handles CSS internally via Theming API) -->
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>

<!-- Flag Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">

<style>
        --ag-font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .ag-header-cell-label { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    
    /* Boat Detail Panel Transitions */
    #boatDetailPanel {
        transition: transform 0.3s ease-in-out;
    }
    
    .boat-badge {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        margin-right: 5px;
        margin-bottom: 5px;
    }
    .boat-badge:hover { background: #e9ecef; border-color: #adb5bd; }
</style>

<script>
    let gridApi;

    const gridOptions = {
        columnDefs: [
            { 
                headerName: "Customer Name", 
                field: "name", 
                cellRenderer: (params) => {
                    return `<div class="fw-bold text-primary">${params.value}</div><small class="text-muted">ID: #${params.data.id}</small>`;
                },
                width: 250,
                pinned: 'left'
            },
            { 
                headerName: "Contact Info", 
                field: "email",
                cellRenderer: (params) => {
                    return `
                        <div class="small"><i class="bi bi-envelope text-muted me-1"></i>${params.data.email || '-'}</div>
                        <div class="small"><i class="bi bi-telephone text-muted me-1"></i>${params.data.phone || '-'}</div>
                    `;
                },
                width: 250
            },
            {
                headerName: "Owned Boats",
                field: "boats",
                cellRenderer: (params) => {
                    if (!params.value || params.value.length === 0) return '<span class="text-muted small italic">No boats</span>';
                    let html = '<div class="d-flex flex-wrap pt-1">';
                    params.value.forEach(boat => {
                        html += `
                            <div class="boat-badge shadow-sm" onclick="showBoatDetails(${JSON.stringify(boat).replace(/"/g, '&quot;')})">
                                <span class="fi fi-${boat.flag_code} fis me-2 rounded-circle" style="width: 14px; height: 14px;"></span>
                                <span class="fw-bold">${boat.name}</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                    return html;
                },
                autoHeight: true,
                flex: 1
            },
            { 
                headerName: "Actions", 
                width: 120, 
                pinned: 'right',
                cellRenderer: (params) => {
                    return `
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary" onclick="editCustomer(${params.data.id})" title="Edit"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-outline-danger" onclick="deleteCustomer(${params.data.id})" title="Delete"><i class="bi bi-trash"></i></button>
                        </div>
                    `;
                }
            }
        ],
        defaultColDef: {
            sortable: true,
            filter: true,
            resizable: true,
        },
        rowData: [],
        rowHeight: 60,
        animateRows: true,
        headerHeight: 40,
        getRowId: (params) => params.data.id
    };

    document.addEventListener('DOMContentLoaded', () => {
        const gridDiv = document.querySelector('#customerGrid');
        
        // Safety check for gridDiv
        if (!gridDiv) {
            console.error('Element #customerGrid not found!');
            return;
        }

        try {
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
            
            // Safe data injection using escapejs
            const rowData = JSON.parse('{{ customers_json|escapejs }}');
            console.log('Customer data loaded successfully:', rowData.length, 'records');
            
            gridApi.setGridOption('rowData', rowData);
            
            // Ensure columns fit
            setTimeout(() => {
                gridApi.sizeColumnsToFit();
            }, 200);

        } catch (err) {
            console.error('Error initializing AG Grid:', err);
        }
    });

    // Helper for manual refresh if needed
    function reloadGrid() {
        window.location.reload();
    }

    function onFilterTextBoxChanged() {
        gridApi.setGridOption('quickFilterText', document.getElementById('gridSearch').value);
    }

    function resetFilters() {
        document.getElementById('gridSearch').value = '';
        gridApi.setGridOption('quickFilterText', '');
        gridApi.setFilterModel(null);
    }

    // Modal Action Handlers
    function createCustomer() {
        htmx.ajax('GET', `/customers/add/`, {target: '#modals-here .modal-content', swap: 'innerHTML'}).then(() => {
            const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modals-here'));
            modal.show();
        });
    }

    function editCustomer(id) {
        htmx.ajax('GET', `/customers/edit/${id}/`, {target: '#modals-here .modal-content', swap: 'innerHTML'}).then(() => {
            const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modals-here'));
            modal.show();
        });
    }

    function deleteCustomer(id) {
        if (confirm("Are you sure you want to delete this customer?")) {
            htmx.ajax('POST', `/customers/delete/${id}/`, {
                headers: {'X-CSRFToken': '{{ csrf_token }}'}
            }).then(() => window.location.reload());
        }
    }

    function editBoat(id) {
        htmx.ajax('GET', `/boats/edit/${id}/`, {target: '#modals-here .modal-content', swap: 'innerHTML'}).then(() => {
            const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modals-here'));
            modal.show();
        });
    }

    // Boat Detail Panel Logic
    function showBoatDetails(boat) {
        const panel = document.getElementById('boatDetailPanel');
        const content = document.getElementById('boatDetailContent');
        const editBtn = document.getElementById('editBoatBtn');
        
        content.innerHTML = `
            <div class="position-relative">
                <img src="${boat.image_url}" class="w-100 object-fit-cover" style="height: 200px;" alt="${boat.name}">
                <div class="position-absolute bottom-0 start-0 w-100 p-3 bg-gradient-dark text-white">
                    <h5 class="mb-0 fw-bold">${boat.name}</h5>
                    <span class="badge bg-primary small">${boat.boat_type}</span>
                </div>
            </div>
            <div class="p-4">
                <div class="row g-3">
                    <div class="col-6">
                        <div class="text-muted xx-small fw-bold">Length</div>
                        <div class="fw-bold fs-5">${boat.length}m</div>
                    </div>
                    <div class="col-6">
                        <div class="text-muted xx-small fw-bold">Flag</div>
                        <div class="d-flex align-items-center">
                            <span class="fi fi-${boat.flag_code} fis me-2 rounded-circle" style="width: 20px; height: 20px;"></span>
                            <span class="fw-bold">${boat.flag}</span>
                        </div>
                    </div>
                    <div class="col-4 border-top pt-2">
                        <div class="text-muted xx-small">Width</div>
                        <div class="fw-bold">${boat.width}m</div>
                    </div>
                    <div class="col-4 border-top pt-2">
                        <div class="text-muted xx-small">Draft</div>
                        <div class="fw-bold">${boat.draft}m</div>
                    </div>
                    <div class="col-4 border-top pt-2 text-end">
                        <div class="text-muted xx-small">Weight</div>
                        <div class="fw-bold">${boat.weight}t</div>
                    </div>
                    <div class="col-12 border-top pt-2">
                        <div class="text-muted xx-small">Tanks</div>
                        <div class="small">
                            <i class="bi bi-fuel-pump text-primary me-1"></i> Diesel: <strong>${boat.diesel}L</strong><br>
                            <i class="bi bi-droplets text-info me-1"></i> Water: <strong>${boat.water}L</strong>
                        </div>
                    </div>
                    <div class="col-12 border-top pt-2">
                        <div class="text-muted xx-small">Notes</div>
                        <p class="small text-muted mb-0 italic">${boat.notes || 'No notes available.'}</p>
                    </div>
                </div>
            </div>
        `;
        
        editBtn.onclick = () => editBoat(boat.id);
        
        panel.classList.remove('d-none');
        panel.classList.add('d-flex');
    }

    function hideBoatDetails() {
        const panel = document.getElementById('boatDetailPanel');
        panel.classList.add('d-none');
        panel.classList.remove('d-flex');
    }

    // HTMX reload listener
    document.addEventListener('htmx:afterOnRequest', (e) => {
        if (e.detail.successful) {
            loadData();
        }
    });
</script>

<style>
    .xx-small { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .bg-gradient-dark { background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
</style>
{% endblock %}
