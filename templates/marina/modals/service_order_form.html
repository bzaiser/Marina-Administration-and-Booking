<div class="modal-header border-0 pb-0">
    <h5 class="modal-title fw-bold">
        <i class="bi bi-gear-wide-connected text-warning me-2"></i>
        {{ title }}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<form hx-post="{{ request.path }}" hx-target="#modals-here .modal-content" hx-indicator="#form-indicator">
    {% csrf_token %}
    <div class="modal-body pt-3">
        
        <!-- Boat & Service Section -->
        <div class="card bg-light border-0 rounded-3 mb-3">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label small fw-bold text-muted text-uppercase">Target Boat</label>
                        {{ form.boat }}
                    </div>
                    <div class="col-md-8">
                        <label class="form-label small fw-bold text-muted text-uppercase">Service Category</label>
                        {{ form.service }}
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Quantity</label>
                        {{ form.quantity }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Scheduling Section -->
        <div class="card border-0 shadow-sm rounded-3 mb-3">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Scheduled Start</label>
                        {{ form.scheduled_start }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Scheduled End</label>
                        {{ form.scheduled_end }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Status & Effort Section -->
        <div class="card bg-light border-0 rounded-3">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Current Status</label>
                        {{ form.status }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Workload (Hours)</label>
                        {{ form.workload_hours }}
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold text-muted text-uppercase">Job Details / Notes</label>
                        {{ form.notes }}
                    </div>
                </div>
            </div>
        </div>

        <div id="form-indicator" class="htmx-indicator mt-3 text-center">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <span class="ms-2 small text-muted">Processing order...</span>
        </div>
    </div>

    <div class="modal-footer border-0 pt-0 pb-4">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-check2-circle me-1"></i> Save Service Order
        </button>
    </div>
</form>

<script>
    $(document).ready(function() {
        // Initialize Select2 with 100% width to fix the narrow boxes
        $('.select2-search').select2({
            dropdownParent: $('#modals-here'),
            width: '100%',
            placeholder: 'Select an option...'
        });
    });
</script>
