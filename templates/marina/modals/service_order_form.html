<div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form hx-post="{{ request.path }}" hx-target="#modals-here .modal-content" hx-indicator="#form-indicator">
    <div class="modal-body">
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label fw-bold">Target Boat</label>
                {{ form.boat }}
            </div>
            <div class="col-md-8">
                <label class="form-label fw-bold">Service Type</label>
                {{ form.service }}
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Quantity</label>
                {{ form.quantity }}
            </div>
            
            <div class="col-md-6">
                <label class="form-label fw-bold">Scheduled Start</label>
                {{ form.scheduled_start }}
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Scheduled End</label>
                {{ form.scheduled_end }}
            </div>
            
            <div class="col-md-6">
                <label class="form-label fw-bold">Status</label>
                {{ form.status }}
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Workload (Hours)</label>
                {{ form.workload_hours }}
            </div>
            
            <div class="col-md-12">
                <label class="form-label fw-bold">Job Notes</label>
                {{ form.notes }}
            </div>
        </div>

        <div id="form-indicator" class="htmx-indicator mt-2">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <span class="ms-2">Saving...</span>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Order</button>
    </div>
</form>

<script>
    // Re-initialize Select2 if used
    $(document).ready(function() {
        $('.select2-search').select2({
            dropdownParent: $('#modals-here')
        });
    });
</script>
