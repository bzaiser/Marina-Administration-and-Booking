<div class="modal-header bg-danger text-white">
    <h5 class="modal-title">Confirm Boat Deletion</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body py-4 text-center">
    <i class="bi bi-exclamation-octagon text-danger fs-1 mb-3 d-block"></i>
    <p class="mb-0">Are you sure you want to delete the boat <strong>{{ boat.name }}</strong>?</p>
    <p class="text-muted small mt-2">This will remove all technical data and historical records for this boat.</p>
</div>
<div class="modal-footer bg-light">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <form hx-post="{% url 'boat_delete' boat.id %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Boat</button>
    </form>
</div>
