<div class="modal-header">
    <h5 class="modal-title">Checkout Successful</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="window.location.reload()"></button>
</div>
<div class="modal-body text-center py-4">
    <i class="bi bi-check-circle text-success fs-1 mb-3"></i>
    <p>The boat has been checked out and the invoice has been generated.</p>
    <div class="d-grid gap-2 col-8 mx-auto">
        <a href="{% url 'invoice_pdf' invoice.id %}" target="_blank" class="btn btn-danger">
            <i class="bi bi-file-pdf"></i> Download Invoice PDF
        </a>
        <a href="{% url 'invoices_list' %}" class="btn btn-outline-primary">View All Invoices</a>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="window.location.reload()">Close</button>
</div>
