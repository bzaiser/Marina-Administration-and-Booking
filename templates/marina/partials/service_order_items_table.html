<div id="order-items-table-container">
    <table class="table table-sm table-hover mb-0">
        <thead class="table-light">
            <tr class="small text-muted text-uppercase">
                <th class="ps-3">Service</th>
                <th style="width: 80px;">Qty</th>
                <th class="text-end pe-3">Price</th>
                <th style="width: 40px;"></th>
            </tr>
        </thead>
        <tbody>
            {% for item in order.items.all %}
            <tr>
                <td class="ps-3">
                    <div class="small fw-bold">{{ item.service.name }}</div>
                    {% if item.notes %}<div class="xx-small text-muted">{{ item.notes }}</div>{% endif %}
                </td>
                <td class="small">{{ item.quantity }}</td>
                <td class="text-end pe-3 small">€{{ item.total_price|floatformat:2 }}</td>
                <td class="text-end pe-2">
                    <button type="button" 
                            class="btn btn-link btn-sm text-danger p-0" 
                            hx-post="{% url 'service_order_remove_item' item.id %}"
                            hx-target="#order-items-table-container"
                            hx-swap="outerHTML"
                            hx-confirm="Remove this item?">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center py-3 text-muted small">No items added yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Quick Add Row -->
    <div class="p-3 bg-light border-top">
        <div class="row g-2 align-items-end">
            <div class="col-md-7">
                <label class="xx-small fw-bold text-muted text-uppercase mb-1">Add Service</label>
                <select name="add_service_id" class="form-select form-select-sm select2-search-items">
                    <option value="">Select service...</option>
                    {% for s in all_services %}
                    <option value="{{ s.id }}">€{{ s.price_per_unit }}/{{ s.get_unit_display }} - {{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="xx-small fw-bold text-muted text-uppercase mb-1">Qty</label>
                <input type="number" name="add_quantity" value="1" step="0.1" class="form-control form-control-sm">
            </div>
            <div class="col-md-2 text-end">
                <button type="button" 
                        class="btn btn-sm btn-success w-100" 
                        hx-post="{% url 'service_order_add_item' order.id %}"
                        hx-include="[name='add_service_id'], [name='add_quantity']"
                        hx-target="#order-items-table-container"
                        hx-swap="outerHTML">
                    <i class="bi bi-plus-lg"></i>
                </button>
            </div>
        </div>
    </div>
</div>
