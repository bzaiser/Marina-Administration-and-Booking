<div id="services-list-container">
    <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
            <thead class="table-light small text-uppercase text-muted">
                <tr>
                    <th class="ps-3">Service</th>
                    <th class="text-end">Qty</th>
                    <th>Notes</th>
                    <th class="text-end pe-3">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for s in services %}
                <tr>
                    <td class="ps-3 fw-bold">{{ s.service.name }}</td>
                    <td class="text-end">{{ s.quantity }} <small class="text-muted">{{ s.service.get_unit_display }}</small></td>
                    <td><small class="text-muted">{{ s.notes|default:"" }}</small></td>
                    <td class="text-end pe-3">
                        <button type="button" 
                                class="btn btn-sm btn-outline-danger border-0" 
                                hx-post="{% url 'booking_remove_service_inline' s.id %}" 
                                hx-target="#services-list-container" 
                                hx-swap="outerHTML">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center py-3 text-muted small">No services added yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Inline Add Form -->
    <div class="p-3 bg-light border-top">
        <form hx-post="{% url 'booking_add_service_inline' booking.id %}" hx-target="#services-list-container" hx-swap="outerHTML" class="row g-2 align-items-end">
            {% csrf_token %}
            <div class="col-md-5">
                <label class="form-label xx-small fw-bold text-muted mb-1">Add Service</label>
                {{ service_form.service }}
            </div>
            <div class="col-md-2">
                <label class="form-label xx-small fw-bold text-muted mb-1">Qty</label>
                {{ service_form.quantity }}
            </div>
            <div class="col-md-4">
                <label class="form-label xx-small fw-bold text-muted mb-1">Notes</label>
                {{ service_form.notes }}
            </div>
            <div class="col-md-1 text-end">
                <button type="submit" class="btn btn-success w-100"><i class="bi bi-plus-lg"></i></button>
            </div>
        </form>
    </div>
</div>

<script>
    // Re-initialize Select2 if needed
    if (typeof initSelect2 === 'function') {
        initSelect2(document.getElementById('services-list-container'));
    }
</script>
