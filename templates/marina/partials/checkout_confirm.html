<div class="modal-header">
    <h5 class="modal-title">Confirm Checkout</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <p>Are you sure you want to check out <strong>{{ booking.boat.name }}</strong> from berth <strong>{{ booking.berth }}</strong>?</p>
    <ul>
        <li>Arrival: {{ booking.start_date }}</li>
        <li>Duration: {{ booking.duration_days }} days</li>
        <li>Estimated Amount: <strong>€{{ booking.calculate_price|stringformat:".2f" }}</strong></li>
    </ul>
</div>
<div class="modal-footer">
    <form hx-post="{% url 'checkout' booking.berth.id %}" hx-target="#modals-here .modal-content">
        {% csrf_token %}
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">Confirm & Generate Invoice</button>
    </form>
</div>
