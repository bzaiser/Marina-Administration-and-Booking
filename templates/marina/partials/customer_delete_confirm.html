{% load i18n %}
<div class="modal-header bg-danger text-white">
    <h5 class="modal-title">{% trans "Confirm Delete" %}</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body py-4 text-center">
    <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3 d-block"></i>
    <p class="mb-0">{% blocktrans with customer_name=customer.name %}Are you sure you want to delete customer <strong>{{ customer_name }}</strong>?{% endblocktrans %}</p>
    <p class="text-muted small mt-2">{% trans "This action cannot be undone. All related boats and bookings might be affected." %}</p>
</div>
<div class="modal-footer bg-light">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
    <form hx-post="{% url 'customer_delete' customer.pk %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">{% trans "Yes, Delete Customer" %}</button>
    </form>
</div>
