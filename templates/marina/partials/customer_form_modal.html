<div class="modal-header border-0 pb-0">
    <h5 class="modal-title fw-bold">
        <i class="bi bi-person-circle text-primary me-2"></i>
        {% if editing %}Edit Customer #{{ customer.id }}{% else %}New Customer{% endif %}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<form hx-post="{% if editing %}{% url 'customer_edit' customer.pk %}{% else %}{% url 'customer_add' %}{% endif %}" 
      hx-target="#modals-here .modal-content"
      class="needs-validation">
    <div class="modal-body pt-3">
        {% csrf_token %}
        
        <div class="card bg-light border-0 rounded-3 mb-3">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label small fw-bold text-muted text-uppercase">Full Name / Company</label>
                        {{ form.name }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Nationality (ISO)</label>
                        {{ form.nationality }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Language (ISO)</label>
                        {{ form.language }}
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3 mb-3">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                        {{ form.email }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Phone Number</label>
                        {{ form.phone }}
                    </div>
                </div>
            </div>
        </div>

        <div class="card bg-light border-0 rounded-3">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label small fw-bold text-muted text-uppercase">Postal Address</label>
                        {{ form.address }}
                    </div>
                    <div class="col-md-12">
                        <label class="form-label small fw-bold text-muted text-uppercase">Tax / VAT Number</label>
                        {{ form.tax_number }}
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-footer border-0 pt-0 pb-4">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-check2-circle me-1"></i> Save Customer
        </button>
    </div>
</form>
