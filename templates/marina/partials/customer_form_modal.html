<div class="modal-header bg-primary text-white">
    <h5 class="modal-title">{% if customer %}Edit Customer{% else %}New Customer{% endif %}</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<form hx-post="{% if customer %}{% url 'customer_edit' customer.pk %}{% else %}{% url 'quick_boat_create' %}{% endif %}" hx-target="#customerTable" hx-swap="outerHTML">
    <div class="modal-body">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold">Customer Name</label>
            {{ form.name }}
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Nationality (ISO)</label>
                {{ form.nationality }}
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Language (ISO)</label>
                {{ form.language }}
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Email</label>
            {{ form.email }}
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Phone</label>
            {{ form.phone }}
        </div>
    </div>
    <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
</form>
