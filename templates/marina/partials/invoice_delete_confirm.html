<div class="modal-header bg-danger text-white">
    <h5 class="modal-title">Confirm Invoice Deletion</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body py-4 text-center">
    <i class="bi bi-exclamation-square text-danger fs-1 mb-3 d-block"></i>
    <p class="mb-0">Are you sure you want to delete invoice <strong>#{{ invoice.id }}</strong> for <strong>{{ invoice.customer.name }}</strong>?</p>
    <p class="text-muted small mt-2">This will remove the billing record and all associated items from the system.</p>
</div>
<div class="modal-footer bg-light">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <form hx-post="{% url 'invoice_delete' invoice.id %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Invoice</button>
    </form>
</div>
