{% extends "base.html" %}
{% load static %}

{% block title %}Timeline - Marina Samos{% endblock %}

{% block extra_head %}
<link href="{% static 'vendor/visjs/vis-timeline-graph2d.min.css' %}" rel="stylesheet" type="text/css" />
<link href="{% static 'vendor/flag-icons/css/flag-icons.min.css' %}" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}">
<style>
    .vis-item {
        font-size: 13px;
        border-radius: 6px;
        box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        padding: 2px;
    }
    .vis-item.vis-selected { border-width: 2px; }
    .vis-item.at-sea { opacity: 0.5; border-style: dashed !important; }
    
    .status-badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: bold;
        margin-left: 8px;
        text-transform: uppercase;
    }
    .badge-guest { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .badge-permanent { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    .badge-at-sea { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
    
    .vis-time-axis .vis-text { color: #7f8c8d; }
    .vis-panel.vis-left { background-color: #f5f5f5; border-right: 1px solid #ddd; width: 110px !important; }
    .vis-label { min-height: 38px !important; border-bottom: 1px solid #ddd !important; color: #444 !important; }
    .vis-label .vis-inner { padding: 8px 10px !important; display: block; }
    .vis-label.vis-nested .vis-inner { padding-left: 25px !important; background-color: white !important; }
    .vis-group-level-unknown-but-gte1 { border: 1px solid #ddd !important; background-color: #f5f5f5 !important; }
    body {
        overflow: hidden;
    }
    main.container-fluid {
        padding-bottom: 0 !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 flex-wrap gap-2">
        <h5 class="mb-0"><i class="bi bi-calendar3 text-secondary me-2"></i><span class="fi fi-de fis me-2"></span>Booking Timeline</h5>
        <div class="d-flex gap-2 align-items-center">
            <input type="text" id="searchBoat" class="form-control form-control-sm" placeholder="Search boat..." style="width: 150px;">
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" onclick="moveWindow(-0.2)"><i class="bi bi-chevron-left"></i></button>
                <button class="btn btn-outline-secondary" onclick="zoomIn()">Zoom In</button>
                <button class="btn btn-outline-secondary" onclick="zoomOut()">Zoom Out</button>
                <button class="btn btn-outline-secondary" onclick="moveWindow(0.2)"><i class="bi bi-chevron-right"></i></button>
            </div>
        </div>
    </div>
    <div class="card-body p-0">
        <div id="visualization" style="height: calc(100vh - 210px);"></div>
    </div>
</div>

<script src="{% static 'vendor/visjs/vis-timeline-graph2d.min.js' %}"></script>

<script>
    let timeline = null;
    let items = new vis.DataSet();
    let groups = new vis.DataSet();

    function initTimeline() {
        const container = document.getElementById('visualization');
        
        const options = {
            stack: true, // Allow multiple bookings in one row
            groupOrder: 'order',
            horizontalScroll: true,
            verticalScroll: true,
            maxHeight: 'calc(100vh - 210px)',
            zoomKey: 'ctrlKey',
            orientation: 'top',
            start: new Date(),
            end: new Date(new Date().getTime() + 1000 * 60 * 60 * 24 * 14), 
            xss: { disabled: true },
            editable: {
                add: true,
                updateTime: false,
                updateGroup: false,
                remove: true
            },
            onAdd: function(item, callback) {
                let endDate = item.end || new Date(item.start.getTime() + 24 * 60 * 60 * 1000);
                const url = `/booking/create/?start=${item.start.toISOString()}&end=${endDate.toISOString()}&resource=${item.group}`;
                const modalEl = document.getElementById('modals-here');
                modalEl.addEventListener('htmx:afterSwap', function handler() {
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.show();
                    modalEl.removeEventListener('htmx:afterSwap', handler);
                });
                htmx.ajax('GET', url, {target: '#modals-here .modal-content', swap: 'innerHTML'});
                callback(null);
            },
            template: function(item) {
                if (!item) return '';
                return `
                    <div style="display: flex; align-items: center; padding: 2px 5px;">
                        <span class="text-primary me-2" 
                              style="font-weight: bold; cursor: pointer;"
                              data-bs-toggle="popover" 
                              data-bs-trigger="hover focus"
                              data-bs-placement="bottom"
                              data-bs-html="true" 
                              data-bs-title="<strong>${item.boat_name}</strong>" 
                              data-bs-content="${item.popover_content}">ⓘ</span>
                        <span class="fi fi-${item.flag} fis me-2" style="flex-shrink:0; border-radius: 2px;"></span>
                        <span style="font-weight: 600;">${item.boat_name}</span>
                        ${item.status_label}
                    </div>
                `;
            },
            onUpdate: function (item, callback) {
                const url = `/booking/edit/${item.id}/`;
                const modalEl = document.getElementById('modals-here');
                modalEl.addEventListener('htmx:afterSwap', function handler() {
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.show();
                    modalEl.removeEventListener('htmx:afterSwap', handler);
                });
                htmx.ajax('GET', url, {target: '#modals-here .modal-content', swap: 'innerHTML'});
                callback(null);
            }
        };

        timeline = new vis.Timeline(container, items, groups, options);
        
        timeline.on('doubleClick', function (properties) {
            if (properties.item) {
                const url = `/booking/edit/${properties.item}/`;
                const modalEl = document.getElementById('modals-here');
                modalEl.addEventListener('htmx:afterSwap', function handler() {
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.show();
                    modalEl.removeEventListener('htmx:afterSwap', handler);
                });
                htmx.ajax('GET', url, {target: '#modals-here .modal-content', swap: 'innerHTML'});
            }
        });

        loadData();
    }

    function getEmojiFlag(countryCode) {
        if (!countryCode || countryCode === 'xx') return '🏳️';
        const codePoints = countryCode
            .toUpperCase()
            .split('')
            .map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }

    function loadData() {
        const t = Date.now();
        Promise.all([
            fetch(`/api/resources/?t=${t}`).then(r => r.json()),
            fetch(`/api/events/?t=${t}`).then(r => r.json())
        ]).then(([resData, evData]) => {
            groups.clear();
            groups.add(resData.map(r => ({
                id: r.id,
                content: `<div>${r.content}</div>`,
                nestedGroups: r.nestedGroups || null,
                showNested: true,
                className: r.className || '',
                order: r.order || 0
            })));

            items.clear();
            items.add(evData.map(e => {
                let statusLabel = '';
                let badgeClass = '';
                let statusText = '';
                
                if (e.is_at_sea) {
                    statusText = 'AT SEA';
                    badgeClass = 'badge-at-sea';
                } else if (e.type === 'LONG') {
                    statusText = 'PERMANENT';
                    badgeClass = 'badge-permanent';
                } else {
                    statusText = 'GUEST';
                    badgeClass = 'badge-guest';
                }
                
                statusLabel = `<span class="status-badge ${badgeClass}">${statusText}</span>`;

                const popoverContent = `
                    <div class="p-1">
                        <img src="${e.image}" class="img-fluid rounded mb-2" style="max-height: 100px; width: 100%; object-fit: cover;">
                        <div class="mb-1"><strong>Owner: ${e.owner}</strong></div>
                        <div class="small text-muted">
                            <i class="bi bi-ship"></i> ${e.boat_type}<br>
                            <hr class="my-1">
                            <i class="bi bi-telephone"></i> ${e.phone}<br>
                            <i class="bi bi-gear"></i> ${e.engine}<br>
                            <i class="bi bi-arrows-fullscreen"></i> ${e.length}m x ${e.width}m (${e.draft}m)<br>
                            <i class="bi bi-fuel-pump"></i> ${e.diesel}L | <i class="bi bi-droplet"></i> ${e.water}L<br>
                            <i class="bi bi-translate"></i> ${e.language} | <i class="bi bi-calendar3"></i> ${e.year}<br>
                            <i class="bi bi-hash"></i> Ref: ${e.ref}
                            ${e.notes ? `<div class="mt-2 p-1 bg-light border-start border-3 border-warning small">Note: ${e.notes}</div>` : ''}
                        </div>
                    </div>
                `.replace(/"/g, '&quot;').replace(/\s+/g, ' ');

                return {
                    id: e.id,
                    group: e.resource,
                    start: e.start,
                    end: e.end,
                    boat_name: e.text,
                    flag: e.flag || 'xx',
                    status_label: statusLabel,
                    popover_content: popoverContent,
                    style: `background-color: ${e.color}22; border-color: ${e.color}; color: #222;`,
                    className: `${e.type === 'LONG' ? 'long-term' : ''} ${e.is_at_sea ? 'at-sea' : ''}`
                };
            }));
        });
    }

    // Global Event Delegation for Popovers
    document.body.addEventListener('mouseover', function (e) {
        const target = e.target.closest('[data-bs-toggle="popover"]');
        if (target && !target.hasAttribute('data-popover-initialized')) {
            new bootstrap.Popover(target, { container: 'body' }).show();
            target.setAttribute('data-popover-initialized', 'true');
        }
    });

    function zoomIn() { timeline.zoomIn(0.2); }
    function zoomOut() { timeline.zoomOut(0.2); }
    function moveWindow(percentage) {
        const range = timeline.getWindow();
        const interval = range.end - range.start;
        timeline.setWindow({
            start: range.start.valueOf() + interval * percentage,
            end: range.end.valueOf() + interval * percentage
        });
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
        initTimeline();

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                moveWindow(-0.1); // Move 10% back
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                moveWindow(0.1); // Move 10% forward
                e.preventDefault();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                const centerPanel = document.querySelector('#visualization .vis-panel.vis-center');
                if (centerPanel) {
                    const scrollAmount = e.key === 'ArrowUp' ? -40 : 40;
                    centerPanel.scrollTop += scrollAmount;
                    e.preventDefault();
                }
            }
        });
    });

    // Search filter
    document.getElementById('searchBoat').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filteredItems = items.get({
            filter: function (item) {
                return !query || item.content.toLowerCase().includes(query);
            }
        });
        // vis.js doesn't have a simple visible flag for items in DataSet easily without re-adding
        // but for now we just log it or we could filter the view
    });
</script>

<!-- Modal for new booking -->
<div id="modals-here" class="modal modal-blur fade" style="display: none" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content"></div>
    </div>
</div>
{% endblock %}
