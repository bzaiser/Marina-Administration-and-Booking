{% extends "base.html" %}

{% block title %}{{ title|default:"Marina Samos" }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="{{ wrapper_class|default:'col-lg-6 col-md-8' }}">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                {% include partial_template %}
            </div>
            
            <div class="text-center mt-4">
                <a href="{% url 'dashboard' %}" class="btn btn-link text-muted text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Override modal styles for full page view */
    .modal-header { border-bottom: 1px solid #eee !important; padding: 1.5rem !important; }
    .modal-footer { border-top: 1px solid #eee !important; padding: 1.5rem !important; }
    .btn-close { display: none; } /* Hide close button on full page */
</style>
{% endblock %}
