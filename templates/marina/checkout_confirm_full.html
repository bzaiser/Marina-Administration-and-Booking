{% extends "base.html" %}
{% load i18n %}

{% block title %}{% blocktrans with boat_name=booking.boat.name %}Checkout - {{ boat_name }} - Marina Samos{% endblocktrans %}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                {% include "marina/partials/checkout_confirm.html" %}
            </div>
            
            <div class="text-center mt-4">
                <a href="javascript:history.back()" class="btn btn-link text-muted text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> {% trans "Go Back" %}
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Override modal styles for full page view */
    .modal-header { border-bottom: 1px solid #eee !important; padding: 1.5rem !important; }
    .modal-footer { border-top: 1px solid #eee !important; padding: 1.5rem !important; }
    .btn-close { display: none; } /* Hide close button on full page */
</style>
{% endblock %}
