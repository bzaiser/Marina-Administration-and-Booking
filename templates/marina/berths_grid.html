{% extends "base.html" %}

{% block title %}Berths Management - Marina Samos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>Berths Management</h5>
    <div class="d-flex gap-2">
        <input type="text" id="filter-text-box" class="form-control form-control-sm" placeholder="Global search..." oninput="onFilterTextBoxChanged()">
    </div>
</div>

<div class="accordion" id="marinaAccordion">
    {% for block in blocks %}
    <div class="accordion-item mb-2 shadow-sm border-0 rounded overflow-hidden">
        <h2 class="accordion-header" id="heading{{ block.id }}">
            <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ block.id }}" style="border-left: 5px solid {{ block.color }};">
                <i class="bi bi-box me-2 text-primary"></i> 
                <div>
                    <strong>Block {{ block.name }}</strong>
                    <span class="badge bg-light text-muted ms-2 border" id="count-{{ block.id }}">Loading...</span>
                </div>
            </button>
        </h2>
        <div id="collapse{{ block.id }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#marinaAccordion">
            <div class="accordion-body p-0">
                <div id="grid-{{ block.id }}" class="ag-theme-alpine w-100" style="height: 350px;"></div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<div id="modals-here" class="modal modal-blur fade" style="display: none" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const gridApis = {};

    const columnDefs = [
        { field: "number", headerName: "Berth #", width: 90, sortable: true },
        { field: "max_length", headerName: "L (m)", width: 70 },
        { field: "max_weight", headerName: "W (t)", width: 70 },
        { field: "current_boat", headerName: "Current Boat", flex: 1, cellRenderer: function(params) {
            if (params.value === 'None') return '<span class="text-muted">-</span>';
            const flagCode = params.data.flag || 'xx';
            const popoverContent = `
                <div class="p-1">
                    <img src="${params.data.boat_image}" class="img-fluid rounded mb-2" style="max-height: 120px; width: 100%; object-fit: cover;">
                    <div class="mb-1 d-flex align-items-center">
                        <span class="fi fi-${flagCode} fis me-2"></span>
                        <strong>${params.data.owner}</strong>
                    </div>
                    <div class="small text-muted">
                        <i class="bi bi-ship"></i> ${params.data.boat_type}<br>
                        <i class="bi bi-calendar-check"></i> In: ${params.data.check_in}<br>
                        <i class="bi bi-calendar-x"></i> Out: ${params.data.check_out}<br>
                        <hr class="my-1">
                        <i class="bi bi-telephone"></i> ${params.data.phone}<br>
                        <i class="bi bi-gear"></i> ${params.data.engine}<br>
                        <i class="bi bi-arrows-fullscreen"></i> ${params.data.length}m x ${params.data.width}m (${params.data.draft}m)<br>
                        <i class="bi bi-fuel-pump"></i> ${params.data.diesel}L | <i class="bi bi-droplet"></i> ${params.data.water}L<br>
                        <i class="bi bi-translate"></i> ${params.data.language} | <i class="bi bi-calendar3"></i> ${params.data.year}<br>
                        <i class="bi bi-hash"></i> Ref: ${params.data.ref}
                        ${params.data.notes ? `<div class="mt-2 p-1 bg-light border-start border-3 border-warning small">Note: ${params.data.notes}</div>` : ''}
                    </div>
                </div>
            `.replace(/"/g, '&quot;');
            
            return `
                <span class="d-flex align-items-center">
                    <i class="bi bi-info-circle text-primary me-2" 
                       style="cursor: pointer;"
                       data-bs-toggle="popover" 
                       data-bs-trigger="hover focus"
                       data-bs-html="true" 
                       data-bs-title="<strong>${params.value}</strong>" 
                       data-bs-content="${popoverContent}"></i>
                    <span class="fi fi-${flagCode} fis me-2" style="flex-shrink:0;"></span>
                    <a href="javascript:void(0)" onclick="editBoat('${params.data.boat_id}')" class="text-decoration-none fw-bold text-dark">
                        ${params.value}
                    </a>
                </span>
            `;
        }},
        { field: "check_in", headerName: "In", width: 90 },
        { field: "check_out", headerName: "Out", width: 90 },
        { field: "status", headerName: "Status", width: 110, cellRenderer: function(params) {
            let color = params.value === 'Occupied' ? 'danger' : (params.value.includes('Sea') ? 'info' : 'success');
            return `<span class="badge bg-${color}">${params.value}</span>`;
        }},
        { headerName: "Actions", width: 150, cellRenderer: function(params) {
            if (!params.data) return '';
            if (params.data.status === 'Vacant') {
                return `
                    <button class="btn btn-xs btn-outline-success py-0 px-2" title="New Booking" onclick="openBookingModal('${params.data.id}')">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                `;
            } else {
                return `
                    <div class="btn-group">
                        <button class="btn btn-xs btn-outline-primary py-0 px-2" title="Edit" onclick="editBooking('${params.data.booking_id}')">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-xs btn-outline-danger py-0 px-2" title="Checkout" onclick="checkout('${params.data.id}')">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                        <button class="btn btn-xs btn-outline-secondary py-0 px-2" title="Delete Booking" onclick="deleteBooking('${params.data.booking_id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                `;
            }
        }}
    ];

    function createGrid(blockId) {
        const gridDiv = document.getElementById(`grid-${blockId}`);
        if (!gridDiv) return;
        
        const gridOptions = {
            columnDefs: columnDefs,
            defaultColDef: { resizable: true, sortable: true, filter: true },
            rowData: [],
            animateRows: true,
            onCellDoubleClicked: function(params) {
                if (params.data && params.data.boat_id) {
                    editBoat(params.data.boat_id);
                } else if (params.data && !params.data.booking_id) {
                    openBookingModal(params.data.id);
                }
            }
        };

        if (typeof agGrid.createGrid === 'function') {
            gridApis[blockId] = agGrid.createGrid(gridDiv, gridOptions);
        } else {
            new agGrid.Grid(gridDiv, gridOptions);
            gridApis[blockId] = gridOptions.api;
        }
    }

    function loadData() {
        fetch('/api/berths/')
            .then(res => res.json())
            .then(data => {
                const blockIds = [{% for block in blocks %}"{{ block.id }}",{% endfor %}];
                blockIds.forEach(id => {
                    const blockData = data.filter(d => String(d.block_id) === String(id));
                    if (gridApis[id]) {
                        if (typeof gridApis[id].setGridOption === 'function') {
                            gridApis[id].setGridOption('rowData', blockData);
                        } else {
                            gridApis[id].setRowData(blockData);
                        }
                        const countEl = document.getElementById(`count-${id}`);
                        if (countEl) countEl.innerText = `${blockData.length} Berths`;
                    }
                });
                
                // Apply global filter immediately if text exists
                if (document.getElementById('filter-text-box').value) {
                    onFilterTextBoxChanged();
                }
                
                // Initialize Popovers after a short delay to ensure DOM is ready
                setTimeout(() => {
                    const popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
                    popoverTriggerList.map(function (popoverTriggerEl) {
                        return new bootstrap.Popover(popoverTriggerEl, {
                            trigger: 'hover' // Change to 'click' if preferred
                        });
                    });
                }, 500);
            });
    }

    document.addEventListener('DOMContentLoaded', () => {
        {% for block in blocks %}createGrid("{{ block.id }}");{% endfor %}
        loadData();

        // Auto-refresh data every 30 seconds
        setInterval(() => {
            console.log("Auto-refreshing berths data...");
            loadData();
        }, 30000);

        // Handle URL parameters to highlight/open a specific berth
        const urlParams = new URLSearchParams(window.location.search);
        const targetBlockName = urlParams.get('block');
        const targetBerthNum = urlParams.get('berth');
        
        if (targetBlockName) {
            const blockIdMap = {
                {% for block in blocks %}
                "{{ block.name }}": "{{ block.id }}",
                {% endfor %}
            };
            const blockId = blockIdMap[targetBlockName];
            if (blockId) {
                // Open the correct accordion block
                const collapseEl = document.getElementById('collapse' + blockId);
                if (collapseEl) {
                    // Hide all other accordions
                    document.querySelectorAll('.accordion-collapse').forEach(el => el.classList.remove('show'));
                    document.querySelectorAll('.accordion-button').forEach(el => el.classList.add('collapsed'));
                    
                    // Show target accordion
                    collapseEl.classList.add('show');
                    const targetBtn = document.querySelector(`[data-bs-target="#collapse${blockId}"]`);
                    if (targetBtn) targetBtn.classList.remove('collapsed');
                }
                
                // If berth number is provided, put it in the filter box
                if (targetBerthNum) {
                    const filterBox = document.getElementById('filter-text-box');
                    filterBox.value = targetBerthNum;
                    // It will be applied automatically when loadData() finishes fetching.
                }
            }
        }
    });

    function onFilterTextBoxChanged() {
        const val = document.getElementById('filter-text-box').value;
        Object.values(gridApis).forEach(api => {
            if (typeof api.setGridOption === 'function') {
                api.setGridOption('quickFilterText', val);
            } else {
                api.setQuickFilter(val);
            }
        });
    }

    function openBookingModal(berthId) {
        htmx.ajax('GET', `/booking/create/?resource=${berthId}`, {target: '#modals-here .modal-content', swap: 'innerHTML'}).then(() => {
            new bootstrap.Modal(document.getElementById('modals-here')).show();
        });
    }

    function editBooking(bookingId) {
        htmx.ajax('GET', `/booking/edit/${bookingId}/`, {target: '#modals-here .modal-content', swap: 'innerHTML'}).then(() => {
            new bootstrap.Modal(document.getElementById('modals-here')).show();
        });
    }

    function checkout(berthId) {
        htmx.ajax('GET', `/checkout/${berthId}/`, {target: '#modals-here .modal-content', swap: 'innerHTML'}).then(() => {
            new bootstrap.Modal(document.getElementById('modals-here')).show();
        });
    }

    function deleteBooking(bookingId) {
        if (confirm("Are you sure you want to delete this booking permanently?")) {
            fetch(`/booking/delete/${bookingId}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            }).then(() => loadData());
        }
    }

    function editBoat(boatId) {
        htmx.ajax('GET', `/boats/edit/${boatId}/`, {target: '#modals-here .modal-content', swap: 'innerHTML'}).then(() => {
            new bootstrap.Modal(document.getElementById('modals-here')).show();
        });
    }
    document.addEventListener('boatChanged', () => {
        const modalEl = document.getElementById('modals-here');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
        loadData();
    });
</script>
{% endblock %}
