{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marina Management Samos{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
    
    <!-- Bootstrap 5 CSS -->
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}">
    <!-- Flag Icons -->
    <link rel="stylesheet" href="{% static 'vendor/flag-icons/css/flag-icons.min.css' %}"/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    
    <!-- Alpine.js -->
    <script defer src="{% static 'vendor/alpinejs/alpine.min.js' %}"></script>
    <!-- HTMX -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    
    <!-- DayPilot Lite (Locally Hosted) -->
    <script src="{% static 'js/daypilot-all.min.js' %}"></script>
    
    <!-- AG Grid -->
    <script src="{% static 'vendor/ag-grid/ag-grid-community.min.js' %}"></script>
    
    <!-- Chart.js -->
    <script src="{% static 'vendor/chartjs/chart.min.js' %}"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-anchor me-2"></i>
                <strong>MARINA SAMOS</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'calendar' %}active{% endif %}" href="{% url 'calendar' %}"><i class="bi bi-calendar3 me-1"></i> Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'berths_grid' %}active{% endif %}" href="{% url 'berths_grid' %}"><i class="bi bi-grid-3x3-gap me-1"></i> Berths</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'customers_list' %}active{% endif %}" href="{% url 'customers_list' %}"><i class="bi bi-people me-1"></i> Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'planning_grid' %}active{% endif %}" href="{% url 'planning_grid' %}"><i class="bi bi-list-check me-1"></i> Planning Grid</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}" href="{% url 'reports' %}"><i class="bi bi-graph-up me-1"></i> Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'invoices_list' %}active{% endif %}" href="{% url 'invoices_list' %}"><i class="bi bi-receipt me-1"></i> Invoices</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="/admin/" class="btn btn-outline-light btn-sm"><i class="bi bi-gear me-1"></i> Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid pb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
