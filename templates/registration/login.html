{% extends "base_auth.html" %}
{% load static %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="bg-primary p-4 text-center">
                <div class="bg-white rounded-circle p-3 d-inline-block mb-3 shadow-sm">
                    <i class="bi bi-anchor text-primary fs-1"></i>
                </div>
                <h3 class="text-white fw-bold mb-0">Marina Samos</h3>
                <p class="text-white-50 small mb-0">Management Portal</p>
            </div>
            <div class="card-body p-4 p-lg-5">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" name="username" class="form-control bg-light border-0 py-2" placeholder="Enter username" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger border-0 small py-2 mb-4">
                        <i class="bi bi-exclamation-triangle me-2"></i> Invalid credentials.
                    </div>
                    {% endif %}

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm rounded-3">
                        Login <i class="bi bi-box-arrow-in-right ms-1"></i>
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light py-3 border-0 text-center">
                <span class="text-muted small">© 2026 Bernd Zaiser</span>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="/" class="text-decoration-none text-white-50 small"><i class="bi bi-arrow-left me-1"></i> Back to Live View (ReadOnly)</a>
        </div>
    </div>
</div>
{% endblock %}
